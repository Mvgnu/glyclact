source_root: /Volumes/T7 Shield/STRAIN_LIBRARY_SEQ_PROCCSSED_DATA/assmebled_and_proccessed_genomes

# Pool v2, selected from the 384-genome screen v2 rescan for a presence/absence
# community landscape. Nine strains give 511 non-empty subsets, or 246 communities
# at sizes 2-4.
#
# Roles are hypotheses from annotation, not phenotype claims. The pool is built so
# that specific exchanges are testable by presence/absence rather than assumed:
#
#   DHA transfer        Gluconobacter (periplasmic sldAB) -> P1_B3 / P3_F11 (DHA kinase + L-LDH)
#   B12 provision       Gluconobacter (complete aerobic cob* route) -> B12 requirers
#   biotin rescue       P1_B3 / P1_B11 -> P3_F11
#   heme + catalase     any katA+ strain -> P3_B12, which is catalase-negative and heme-dependent
#   product sink        P1_A3 and P2_D12 consume lactate; their presence should cost titre
#
# Selection results worth recording, from the in-pool coverage matrix in
# results/POOL_V2.md:
#   * Only lipoate is unmet inside the pool, and it is needed only by P3_B12. That
#     creates a real trade-off rather than a gap: supplying lipoate rescues P3_B12 but
#     also enables pyruvate dehydrogenase in every other member, which is the main
#     aerobic drain away from lactate.
#   * Methionine, needed by both Gluconobacter donors, is supplied in-pool by P3_A10
#     and P3_B12, so the DHA shuttle can be closed nutritionally without importing a
#     lactate consumer.
#   * P3_B12's sulfate-assimilation requirement is covered only by P2_D12, the rich
#     supporter that also consumes lactate — so rescuing the Lactococcus costs product.
#   * Only P1_B3 and P1_B11 are prototrophic, catalase-positive, high-provision strains
#     with zero lactate consumption AND a glpF-supported glycerol route. In this library
#     "supporter" and "producer" are the same strains; there is no dedicated safe
#     supporter, and P3_G9 (the one candidate that was) cannot use glycerol.
#
# Deliberately excluded:
#   P3_A3   highest producer score (43.8) but 99.78% Staphylococcus — not an
#           industrially usable host, and a biosafety review case.
#   P3_H7   carves to a reaction set identical to P3_C11 (2484 reactions, zero
#           difference), so it adds simulation cost and no information. P3_C9 is the
#           genuinely independent second Gluconobacter (573 reactions differ).
#   P3_G9   removed at the model gate — cannot use glycerol, see note below.
#   P1_G5   Brucella pseudogrignonensis by ANI (99.56%) — opportunistic pathogen.
#           Replaced by P1_A3. See results/POOL_V2.md.

candidates:
  # ---------------------------------------------------------------- producers
  - genome: P1_B3
    role: producer_receiver_supporter
    rationale: >-
      *Priestia aryabhattai* (Bacillaceae) by ANI. **The "Aneurinibacillus, 100% genus
      support" label carried here since pool v2 was wrong**, and the reason is worth
      recording: MEGAN percentages are normalised within each rank row, so a row holding a
      single name always reads 100% however few reads back it. This genome's own family
      row says Bacillaceae 99.98% against Aneurinibacillaceae 0.02%, and its order row
      says Bacillales 99.96% — the genus row was the outlier, not the evidence. ANI is
      decisive: zero hits across all 436 Paenibacillaceae species, against *P. aryabhattai*
      at 99.47% in Bacillaceae. identify_strains.py now reads the family row directly and
      escalates there when it disagrees with the genus. The keystone: L-lactate producer-favoured
      with annotated export, zero predicted requirements, catalase-positive, zero
      lactate consumption, and a confident DHA kinase so it can also act as receiver.
      Covers biotin, pantothenate and respiratory quinone for partners. Not a risk genus.
  - genome: P1_B11
    role: producer_low_aerobic_drain
    rationale: >-
      Bacillus, 99.38%. Best aerobic profile in the pool: four PDH subunits but no
      pyruvate oxidase and no NADH oxidase, so least pyruvate and NADH diverted from
      lactate under aeration. Prototrophic, L-only, annotated export.
  - genome: P3_F11
    role: producer_biotin_dependent
    rationale: >-
      Bacillus, 100%. Equal producer score to P1_B11 but requires biotin, which makes
      it the test case for biotin rescue by P1_B3 or P3_G9. Also a DHA receiver.

  # -------------------------------------------------------- informative control
  - genome: P3_A10
    role: producer_export_gap_control
    rationale: >-
      Paenibacillus, 100%. Producer-favoured and prototrophic but carries no annotated
      lactate transporter, and its GEM correspondingly has no lactate exchange. Tests
      whether the unannotated-export call predicts a real inability to secrete.

  # --------------------------------------------------------------- supporter
  # P3_G9 (Paenibacillus, 99.96%) was selected here and then removed at the model
  # gate: it cannot use glycerol. GLYCtex delivers glycerol to the periplasm and GLYK
  # waits in the cytosol, but no inner-membrane transport connects them, and the
  # genome carries no glpF or any MIP-family aquaglyceroporin — so adding GLYCtpp
  # would be an assumption, not curation from evidence. CarveMe placed GLYCtpp in
  # exactly the strains that do have glpF, so the gap is faithful to the genome.
  # No replacement exists: the only strains meeting the supporter criteria with glpF
  # are P1_B3 and P1_B11, both already in the pool, which therefore carry the
  # supporter role as well. Restore P3_G9 by re-adding it here if a glycerol-negative
  # obligate cross-feeder becomes interesting — but note the only in-pool source of
  # a carbon form it can use (G3P) is P2_D12, which also consumes lactate.
  # -------------------------------------------------------------- DHA donors
  - genome: P3_C11
    role: dha_donor
    rationale: >-
      Gluconobacter frateurii by ANI (96.7%, 90% aligned) — not G. oxydans. Membrane-bound
      PQQ sldAB with four pqq genes, so glycerol is oxidised in the periplasm and DHA
      appears extracellularly without a transporter. Complete aerobic cob* route, so it
      is also the pool's B12 source. Requires methionine, pantothenate, quinone.
  - genome: P3_C9
    role: dha_donor_independent
    rationale: >-
      Gluconobacter, 99.86%. Same periplasmic PQQ signature but a genuinely distinct
      genome, unlike P3_H7 which carves identically to P3_C11.

  # ------------------------------------------------------- rescue test case
  - genome: P3_B12
    role: lactate_specialist_rescue_test
    rationale: >-
      Lactococcus lactis by ANI (98.2%). Loses every role under aeration — noxE, poxL,
      no catalase, heme-dependent, lipoate salvage-only, eight requirements, unannotated
      export — yet it is the food-grade industrial lactate organism. Included because it
      is the one strain where a community could plausibly beat the monoculture: heme and
      catalase from a partner plus a lipoate-free medium to suppress PDH.

  # ------------------------------------------------ trade-off and negative controls
  - genome: P2_D12
    role: rich_supporter_consumes_lactate
    rationale: >-
      Rahnella, 99.90%. Highest provision count available at 22 pathways with catalase,
      but it consumes lactate. Tests directly whether nutritional richness is worth the
      product loss.
  - genome: P1_A3
    role: lactate_sink_negative_control
    rationale: >-
      Lysinibacillus xylanilyticus by ANI (96.0%, 89% aligned), genus 99.99% with a
      consistent Planococcaceae family call. Three lactate consumption genes and no
      L-LDH, so it is a product sink; prototrophic, catalase-positive, and grows on
      glycerol. Chosen over the alternatives for the *fewest* provisions in the pool
      (13), which is what a clean sink control needs — P2_D5 (Pantoea) offered 22 and
      would have confounded the sink effect with nutritional support.
      Replaces P1_G5, which ANI identified as Brucella pseudogrignonensis (99.56%,
      strain-level) — an opportunistic pathogen that the screen had cleared because
      Ochrobactrum predates its 2020 reclassification into Brucella. P3_E12
      (Pseudochrobactrum) was rejected for the same reason: Rhizobiaceae, with
      Ochrobactrum among its nearest genus neighbours.

  # ================================================================ pool v3 additions
  #
  # The design brief changed. Pairwise designs reasoned from genome content are exactly
  # where prediction decays fastest as members are added, so breadth now beats
  # optimality: multiple producers, multiple supporters, and lineages far enough apart
  # that their interactions are not derivable from the annotation. These ten are chosen
  # for spread — new genera, new phyla, new fermentation modes — with score as a
  # tiebreak only. All ten carry risk_genus=0, biosafety_review_required=0 and zero
  # virulence name matches, except P3_A3 which is explicitly conditional on ANI.
  #
  # Deliberately avoided: Klebsiella (17 strains), Citrobacter (16), Raoultella (24)
  # and Enterobacter. They dominate the supporter rankings but are opportunistic
  # pathogens, and the P1_G5/Brucella episode showed genus-level clearance is not
  # enough. Kluyvera scored highest of all supporters (66.0) but its genus call is
  # only 62%, so it fails the confidence filter.

  # ---------------------------------------------------- producers: pedigree and isomer
  - genome: P2_A5
    role: producer_lab_reference_fbp_independent
    rationale: >-
      Lactiplantibacillus, 99.98%. The highest-value addition available, for a reason
      that comes straight out of OVERFLOW_TRIGGERS.md: *L. plantarum* LDH is the
      documented **FBP-independent** bacterial L-LDH, where Bacillus and Lactococcus
      LDHs need fructose-1,6-bisphosphate to activate. Glycerol enters glycolysis below
      the aldolase step, so FBP is a gluconeogenic trickle — hypothesis H3 says that
      should cripple FBP-dependent producers on glycerol. This strain is the direct test
      of that, and it is food-grade with decades of process literature, which the three
      current producers entirely lack. Six L-LDH and two D-LDH copies, producer-favoured,
      annotated export. Eleven requirements including heme, biotin and quinone, so it is
      also the pool's strongest beneficiary of the supporters. Risk to be aware of: no
      cytoplasmic glycerol dehydrogenase, so it may not grow on glycerol alone at all —
      which the viability gate will settle, and which is informative either way.
  - genome: P1_F12
    role: producer_heterofermentative_d_isomer
    rationale: >-
      Leuconostoc, 99.02%. Heterofermentative LAB — D-lactate dominant (4 D-LDH to 1
      L-LDH) plus ethanol and CO2, a fermentation mode absent from the pool. Has no
      glycerol kinase, so it cannot start on the feedstock and can only live on
      cross-fed carbon. That is not a defect for this brief: an obligate cross-feeder is
      precisely the kind of member whose behaviour is not predictable from its own
      genome, and it tests whether the pool generates enough exchangeable carbon to
      carry a passenger. Catalase-negative, so it shares P3_B12's need for a peroxide
      scavenger.
  - genome: P3_A3
    role: producer_top_scoring_conditional
    rationale: >-
      Staphylococcus, 99.78% — **conditional on species-level ANI, run before the model
      is built.** Highest producer score in the entire 384-genome screen (43.8),
      L-and-D, producer-favoured, annotated export, and consumes no lactate. Many
      environmental staphylococci are BSL-1 and two (*S. xylosus*, *S. equorum*) are
      food-fermentation organisms; *S. aureus* is the exclusion. Zero virulence name
      matches, flagged only for genus membership. Requires proline, serine and biotin,
      all covered in-pool. Drop on an *aureus*-group call.

  # ------------------------------------ supporters: the yeast-extract substitute panel
  # H5 gave this role its economic argument: yeast extract is up to 38% of lactic-acid
  # production cost, and the 95%-of-theoretical B. subtilis result needed 8 g/L of it.
  # A partner that delivers amino acids in situ is competing against that cost line.
  - genome: P2_G9
    role: supporter_max_amino_acid_export
    rationale: >-
      BIGb0383, 99.88% — an unresolved genus label, so ANI is genuinely informative here
      rather than confirmatory. Nine annotated amino-acid exporters, the most in the
      library, with 22 provided pathways and no requirements. Uniquely among the
      supporters it has **no pyruvate oxidase and no NADH oxidase**, so it diverts
      nothing from the lactate node, and it carries annotated lactate export with
      catalase, peroxidase and superoxide dismutase. The closest thing to a free
      supporter in the pool.
  - genome: P3_F8
    role: supporter_oxidative_shield
    rationale: >-
      Ewingella, 99.97%. Joint-highest provisioner at 23 pathways with seven amino-acid
      exporters, and the best oxidative defence available — catalase 3, peroxidase 4,
      superoxide dismutase 2. That matters specifically for P3_B12, P2_A5 and P1_F12,
      which are catalase-poor and heme-dependent; LITERATURE_CROSSREF.md established
      that peroxide load, not nutrition, is what caps Lactococcus aerobically on
      glycerol. Consumes lactate but has no annotated exporter, so it is a value-adding
      consumer rather than a cycling one.
  - genome: P1_G3
    role: supporter_and_dha_donor
    rationale: >-
      Erwinia, 99.70%. 23 provided pathways and six amino-acid exporters, plus five pqq
      genes — so it is a second, phylogenetically independent DHA donor alongside the
      two Gluconobacters, which are near-duplicates of each other. Breaks the pool's
      single point of failure on the DHA route.
  - genome: P2_D5
    role: supporter_broad
    rationale: >-
      Pantoea, 100%. 22 provided pathways, six amino-acid exporters, five pqq genes and
      strong oxidative defence. Previously *rejected* as a sink control because 22
      provisions would have confounded the sink effect with nutritional support — under
      the new brief that is exactly the property wanted, so the earlier rejection
      reverses.

  # ------------------------------------------- breadth: non-Firmicute, non-enterobacter
  # The supervisor's point, taken seriously: interactions between distant lineages are
  # the ones least derivable from annotation, and the pool was two phyla deep.
  - genome: P3_G8
    role: breadth_actinobacteria_robust
    rationale: >-
      Rhodococcus, 99.48%. Actinobacteria — a phylum absent from the pool. Twenty
      provided pathways, six amino-acid exporters, catalase 3, no requirements, and a
      7.5 Mbp genome with unusually broad catabolic range. Seven PDH subunits means a
      large pyruvate drain, so it is not a producer; it is here for robustness and for
      interactions nothing in the annotation predicts. Assembly is 'acceptable' rather
      than good at 157 contigs.
  - genome: P2_C2
    role: breadth_actinobacteria_non_consumer
    rationale: >-
      Oerskovia, 99.62%. Second Actinobacterium, chosen over Corynebacterium and
      Leucobacter for one decisive reason: it grows on glycerol and **consumes no
      lactate**. Corynebacterium P2_B2 was the obvious pick on paper — the classic
      amino-acid overproducer genus, catalase 3, 18 pathways — but it has neither
      glycerol kinase nor facilitator and five lactate-consumption genes, making it a
      pure product sink that cannot even use the feedstock. Nineteen provided pathways;
      needs biotin, which is covered in-pool.
  - genome: P2_E7
    role: breadth_bacteroidetes_dha_donor
    rationale: >-
      Chryseobacterium, 99.95%. Bacteroidetes — a third phylum. Carries a **periplasmic**
      glycerol dehydrogenase plus two cytoplasmic ones, so it is a third independent DHA
      donor by a different mechanism than the PQQ quinoproteins. Consumes no lactate, 18
      provided pathways, requires only proline. The most functionally distinct member of
      the additions.

  # ============================================== purity-constrained supporter additions
  #
  # Optical purity turned out to be a hard specification rather than a soft penalty:
  # PLA-grade L-lactate needs >=98-99% optical purity, so a supporter carrying a D-LDH can
  # take a community off-spec no matter how much total lactate it adds. **52.9% of the
  # library carries a D-LDH**, so the default supporter is a purity risk.
  #
  # Searching for the opposite profile showed which constraint actually binds:
  #
  #   no D-LDH (purity-safe)                      32 genomes / 13 genera  -- easy
  #   no LDH at all AND no lactate consumption      7 genomes /  6 genera  -- and only
  #                                                 ~3 of those provision anything at all
  #
  # So the binding constraint is not purity, it is *not eating the product*. And those two
  # failures are not equally bad: a supporter that eats L-lactate costs titre (less
  # product, still on-spec), whereas one that makes D-lactate destroys the specification
  # (product unsaleable). Purity is therefore the hard filter and consumption a measurable
  # cost, which is what these three are chosen against.
  #
  # Note: `P2_E7` (already in the pool) is the best "no LDH, eats nothing" supporter in the
  # whole library at 18 provided pathways. These additions widen a bench that turns out to
  # be one strain deep.

  - genome: P2_G8
    role: supporter_inert_to_lactate
    rationale: >-
      Chishuiella, 100% genus support. **The only other genome in 384 that is genuinely
      inert toward lactate**: zero L-LDH, zero D-LDH, zero lldD/dld, and zero lactate
      transporter, all confirmed by direct KO check rather than score column. It can
      neither contaminate the product nor consume it. Carries glpK and glpF so it can
      establish on the feedstock rather than needing to be carried, and has a
      **periplasmic glycerol dehydrogenase**, making it a third independent DHA-donor
      mechanism alongside the Gluconobacter quinoproteins and P2_E7. Fifteen provided
      pathways but **zero annotated amino-acid exporters**, so it provisions cofactors
      rather than amino acids -- pair it with a tier-B strain rather than relying on it
      alone. Bacteroidetes, needs proline, biotin and thiamine, all covered in-pool.
  - genome: P3_G12
    role: supporter_purity_safe_provisioner
    rationale: >-
      Brevibacterium, 99.8%. Purity-safe by the hard filter -- zero L-LDH and zero D-LDH
      confirmed by KO check -- with 18 provided pathways, 3 amino-acid exporters and
      catalase 2. Requires **only biotin**, the lightest dependency of any candidate at
      this provisioning level, and it is covered by eight pool members. Actinobacteria,
      so phylogenetically distant from the producers. The cost is explicit: two lldD/dld
      copies and three lactate transporters, so it will eat L-lactate. That is a titre
      penalty to be measured, not a specification failure.
  - genome: P2_E9
    role: supporter_max_amino_acid_purity_safe
    rationale: >-
      Leucobacter, 99.8%. **Five annotated amino-acid exporters, the most of any
      purity-safe candidate without a biosafety flag** -- Lelliottia P3_G2 has seven but is
      Enterobacteriaceae with an hlyC match, which is the family and the flag pattern this
      whole exercise is trying to avoid. Eighteen provided pathways, Actinobacteria, zero
      LDH of either isomer. Also eats lactate (2 lldD/dld). Directly addresses the gap
      P2_G8 leaves: this is the amino-acid provider for the purity-constrained arm, and
      the H5 precursor-supply hypothesis needs one. Requires sulfate assimilation, biotin
      and thiamine (salvage).

  # ===================================== clean supporters (no D-LDH, no lactate oxidase)
  #
  # Constraint corrected: L-only is acceptable in a supporter, because L-lactate is the
  # same molecule as the product and cannot take a batch off-spec. Only D-LDH can. Adding
  # "no lactate oxidase" on top gives the profile that neither contaminates nor consumes.
  #
  # Recounted directly from the annotations (results/purity_scan.tsv) rather than from the
  # screen's score columns, because those disagreed on L-LDH presence in **19 of 260**
  # genomes. Against the corrected constraint: 46/260 genomes qualify (17.7%) across 24
  # genera — but after assembly, genus-confidence and provisioning filters only 17 remain,
  # and those are dominated by 4 Paenibacillus and 7 near-identical Lactococcus. The pool
  # held only two clean supporters (P2_E7, P2_G8), so these three take it to five and let
  # the model gate choose.

  - genome: P3_A8
    role: supporter_clean_provisioner
    rationale: >-
      Paenibacillus, 100%. The cleanest genuinely new option: 18 provided pathways, two
      L-LDH and **zero** D-LDH and zero lactate oxidase, so it can contribute L-lactate but
      never contaminate or consume. Requires only biotin, which eight pool members supply.
      Carries `glpK` but **no `glpF`** — as do all four qualifying Paenibacillus, so
      glycerol uptake for that genus is the open question and the model gate decides it.
  - genome: P3_G9
    role: supporter_best_profile_glycerol_negative
    rationale: >-
      Paenibacillus, 100%. **The best supporter profile in the entire qualifying set** —
      19 provided pathways, catalase 3 (the strongest oxidative shield among clean
      candidates), **zero requirements**, L-only, no consumption. Re-added deliberately
      after being cut in pool v2 for the one thing that has not changed: **it cannot use
      glycerol.** `GLYCtex` delivers glycerol to the periplasm and `GLYK` waits in the
      cytosol with no inner-membrane transport between them, and the genome has no `glpF`
      or any MIP-family aquaglyceroporin. So it is an obligate cross-feeder. Included
      because the purity constraint makes provisioning scarce enough that a strain which
      cannot touch the feedstock but shields the LAB from peroxide is worth testing — and
      because whether the pool releases enough exchangeable carbon to carry a passenger is
      itself one of the more interesting questions in the design.
  - genome: P2_C2
    role: supporter_clean_glycerol_capable_model_unreliable
    rationale: >-
      Oerskovia merdavium, 99.6%. **The only clean qualifier with both `glpK` and `glpF`**,
      so the only one certain to establish on the feedstock unaided, at 19 provided
      pathways. Re-added with an explicit caveat: its model **fails the redox gate** at
      electron recovery 1.0714, and unlike `P1_A3` the leak does not localise — the
      per-reaction imbalances cancel, so it runs through a metabolite whose formula cannot
      be scored. Treat its quantitative output as unreliable; it is usable for
      presence/absence coexistence and provisioning tests, not for yield numbers. The
      strain is very likely fine — the reconstruction is not.
